name: Build and Release DX11 Game

on:
  workflow_dispatch:

env:
  SOLUTION_PATH: 'Project1.sln'
  BUILD_CONFIG: Release
  PLATFORM: x64

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build with MSBuild
      run: msbuild "${{ env.SOLUTION_PATH }}" /p:Configuration="${{ env.BUILD_CONFIG }}" /p:Platform="${{ env.PLATFORM }}" /m /v:minimal

    - name: Collect files
      shell: powershell
      run: |
        $releaseDir = "release"
        New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null
        
        # EXE
        Copy-Item -Path "x64/Release/*.exe" -Destination $releaseDir -Force -ErrorAction SilentlyContinue
        
        # DLL
        Copy-Item -Path "x64/Release/*.dll" -Destination $releaseDir -Force -ErrorAction SilentlyContinue
        
        # CSO（コンパイル済みシェーダー）
        Copy-Item -Path "x64/Release/*.cso" -Destination $releaseDir -Force -ErrorAction SilentlyContinue
        
        # assimp フォルダ
        if (Test-Path "x64/Release/assimp") {
          Copy-Item -Path "x64/Release/assimp" -Destination $releaseDir -Recurse -Force
        }
        
        # asset フォルダ
        if (Test-Path "x64/Release/asset") {
          Copy-Item -Path "x64/Release/asset" -Destination $releaseDir -Recurse -Force
        }
        
        # ZIP化
        Compress-Archive -Path "$releaseDir/*" -DestinationPath "DX21_YUREIHEN_GAME.zip" -Force

    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: DX21_YUREIHEN_GAME.zip
        generate_release_notes: true
        tag_name: v${{ github.run_number }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
