name: Build and Release DX11 Game

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Clean
      run: msbuild "Project1.sln" /t:Clean /p:Configuration="Release" /p:Platform="x64"

    - name: Build with MSBuild
      run: msbuild "Project1.sln" /p:Configuration="Release" /p:Platform="x64" /m /v:minimal

    - name: Collect files
      shell: powershell
      run: |
        New-Item -ItemType Directory -Path "release" -Force | Out-Null
        
        Copy-Item -Path "x64/Release/*.exe" -Destination "release" -Force
        Copy-Item -Path "x64/Release/*.cso" -Destination "release" -Force
        Copy-Item -Path "x64/Release/*.dll" -Destination "release" -Force
        Copy-Item -Path "assimp" -Destination "release" -Recurse -Force
        Copy-Item -Path "asset" -Destination "release" -Recurse -Force
        
        Compress-Archive -Path "release/*" -DestinationPath "DX21_YUREIHEN_GAME.zip" -Force

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: DX21_YUREIHEN_GAME.zip
        generate_release_notes: true
        tag_name: Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
