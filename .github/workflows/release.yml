name: Build and Release DX11 Game

on:
  workflow_dispatch:

env:
  SOLUTION_PATH: 'Project1.sln'
  BUILD_CONFIG: Release
  PLATFORM: x64
  BUILD_OUT_DIR: 'x64/Release/Sample'
  ARTIFACT_NAME: 'DX21_YUREIHEN_GAME'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build with MSBuild
      run: msbuild "${{ env.SOLUTION_PATH }}" /p:Configuration="${{ env.BUILD_CONFIG }}" /p:Platform="${{ env.PLATFORM }}" /m /v:minimal

    - name: Collect files
      shell: powershell
      run: |
        New-Item -ItemType Directory -Path "release" -Force
        Copy-Item -Path "${{ env.BUILD_OUT_DIR }}\*" -Destination "release" -Recurse -Force
        Compress-Archive -Path "release\*" -DestinationPath "${{ env.ARTIFACT_NAME }}.zip" -Force

    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ env.ARTIFACT_NAME }}.zip
        generate_release_notes: true
        tag_name: v${{ github.run_number }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
