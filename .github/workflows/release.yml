name: Build and Release DX11 Game

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:

env:
  SOLUTION_PATH: 'Project1.sln'
  BUILD_CONFIG: Release
  PLATFORM: x64
  BUILD_OUT_DIR: 'x64/Release/Sample'
  ARTIFACT_NAME: 'DX21_YUREIHEN_GAME'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build with MSBuild
      run: |
        msbuild "$env:SOLUTION_PATH" `
          /p:Configuration="$env:BUILD_CONFIG" `
          /p:Platform="$env:PLATFORM" `
          /m `
          /v:minimal

    - name: Collect files
      run: |
        mkdir release
        xcopy /E /I /Y "$env:BUILD_OUT_DIR" "release"
        Compress-Archive -Path "release\*" -DestinationPath "$env:ARTIFACT_NAME.zip" -Force

    - name: Create Release (tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ env.ARTIFACT_NAME }}.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Artifact (button)
      if: github.event_name == 'workflow_dispatch'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ARTIFACT_NAME }}
        path: ${{ env.ARTIFACT_NAME }}.zip
