name: Build and Release DX11 Game

on:
  workflow_dispatch:

env:
  SOLUTION_PATH: 'Project1.sln'
  BUILD_CONFIG: Release
  PLATFORM: x64

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build with MSBuild
      run: msbuild "${{ env.SOLUTION_PATH }}" /p:Configuration="${{ env.BUILD_CONFIG }}" /p:Platform="${{ env.PLATFORM }}" /m /v:minimal

    - name: Check build output
      shell: powershell
      run: |
        Write-Host "=== x64/Release 以下のファイル構造 ==="
        Get-ChildItem -Path "x64/Release" -Recurse | Format-Table FullName

    - name: Collect files
      shell: powershell
      run: |
        New-Item -ItemType Directory -Path "release" -Force
        
        # x64/Release 直下の全ファイルをコピー
        if (Test-Path "x64/Release") {
          Copy-Item -Path "x64/Release\*" -Destination "release" -Recurse -Force -ErrorAction SilentlyContinue
        }
        
        # ZIP化
        Compress-Archive -Path "release\*" -DestinationPath "DX21_YUREIHEN_GAME.zip" -Force

    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: DX21_YUREIHEN_GAME.zip
        generate_release_notes: true
        tag_name: v${{ github.run_number }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
