name: Build and Release DX11 Game

on:
  push:
    tags:
      - 'v[0-9]*'   # v1, v2, v3... みたいなタグを押したときだけ動く
  workflow_dispatch: # ボタンクリックで手動実行

env:
  SOLUTION_PATH: 'Project1.sln'   # 実際のsln名
  BUILD_CONFIG: Release
  PLATFORM: x64
  BUILD_OUT_DIR: 'x64/Release/Sample'       # VSの出力先と合わせる
  ARTIFACT_NAME: 'DX21_YUREIHEN_GAME'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # リリース作成に必要

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Build with MSBuild
      run: |
        msbuild "$env:SOLUTION_PATH" `
          /p:Configuration="$env:BUILD_CONFIG" `
          /p:Platform="$env:PLATFORM" `
          /m `
          /v:minimal

    - name: Collect files (Sample folder layout)
      run: |
        mkdir release
        xcopy /E /I /Y "$env:BUILD_OUT_DIR" "release"
        powershell Compress-Archive -Path "release\*" -DestinationPath "$env:ARTIFACT_NAME.zip"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: ${{ env.ARTIFACT_NAME }}.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
